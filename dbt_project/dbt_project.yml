name: 'dbt_project'
version: '1.0.0'
config-version: 2

profile: 'dbt_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Silver: cleaned and typed tables. Gold: dim/fact tables for reporting.
models:
  dbt_project:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
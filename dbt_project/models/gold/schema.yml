version: 2
models:
  - name: fact_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]